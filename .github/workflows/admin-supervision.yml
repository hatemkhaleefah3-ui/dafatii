name: Admin supervision patch

on:
  push:
    branches:
      - feature/admin-supervision-reset

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/admin-supervision-reset
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply supervision patch
        run: node scripts/apply-admin-supervision.mjs
      - name: Verify
        run: |
          npm test
          npm run check
      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add admin supervision and higher-education Dafaa ownership"
            git push origin HEAD:feature/admin-supervision-reset
          fi
