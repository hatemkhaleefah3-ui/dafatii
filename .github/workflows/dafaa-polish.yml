name: Dafaa terminology polish

on:
  push:
    branches:
      - refactor/dafaa-domain-rename
    paths:
      - .github/workflows/dafaa-polish.yml
      - scripts/polish-dafaa-domain.mjs

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dafaa-domain-rename
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply terminology and cache polish
        run: node scripts/polish-dafaa-domain.mjs
      - name: Verify repository
        run: |
          npm test
          npm run check
      - name: Commit polished repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Dafaa Dafat and Dafati terminology"
          git push origin HEAD:refactor/dafaa-domain-rename
