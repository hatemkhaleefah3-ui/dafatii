name: Backend boundary tests
on:
  pull_request:
  push:
    branches: [codex/backend-gcs-storage]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
