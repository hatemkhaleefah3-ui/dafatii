name: Auth bootstrap repair

on:
  push:
    branches:
      - fix/auth-dafaa-bootstrap-20260917

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-dafaa-bootstrap-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply auth bootstrap repair
        run: |
          node scripts/fix-auth-dafaa-bootstrap.mjs
          node scripts/postpatch-auth-repair.mjs
      - name: Verify repository
        run: |
          npm test
          npm run check
      - name: Commit repaired runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Decouple auth from Dafaa schema bootstrap"
            git push origin HEAD:fix/auth-dafaa-bootstrap-20260917
          fi
